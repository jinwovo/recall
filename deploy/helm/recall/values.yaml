nameOverride: ""

backend:
  image:
    repository: ghcr.io/jinwovo/recall-backend
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  port: 8080
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }

embedding:
  image:
    repository: ghcr.io/jinwovo/recall-embedding
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 8000
  # Sized from measurement, not from a guess. bge-m3 and bge-reranker-v2-m3 resident
  # together were observed at 3.7Gi idle and 5.6Gi while indexing and evaluating a
  # 5,183-document corpus; the previous 4Gi limit was under the working set and would be
  # OOMKilled by the first real load. CPU was 200-500% across the same window, so a 2-core
  # limit throttles exactly the stage that dominates every query.
  resources:
    requests: { cpu: "2", memory: 4Gi }
    limits: { cpu: "4", memory: 8Gi }
  # uvicorn only binds once the lifespan hook holds both models, so /health is a real
  # readiness signal — and a slow one. With the cache below populated it answers in ~15s;
  # without it, the pod downloads ~6GB of weights first and took 510s to come up. The
  # startup probe has to cover the cold path or the liveness probe kills the pod mid
  # download and the deployment never converges. 60 x 10s matches what compose allows.
  startupFailureThreshold: 60
  # Model weights, so a restart does not re-download 6GB. Off by default because it needs a
  # StorageClass; leaving it off is supported, and costs the cold start above every restart.
  persistence:
    enabled: false
    size: 12Gi
    storageClass: ""
    accessMode: ReadWriteOnce

# External backing services — provide your own (managed or via subcharts).
config:
  esHost: http://elasticsearch:9200
  esIndex: recall-docs
  redisHost: redis
  redisPort: "6379"
  postgresHost: postgres
  postgresPort: "5432"
  postgresDb: recall
  postgresUser: recall
  kafkaBootstrap: kafka:9092
  kafkaIngestionDlqTopic: recall.ingestion.dlq
  minioEndpoint: http://minio:9000
  minioBucket: recall-raw

# Secret with sensitive values — create separately, e.g.:
#   kubectl create secret generic recall-secrets \
#     --from-literal=anthropic-api-key=sk-ant-... \
#     --from-literal=postgres-password=... \
#     --from-literal=minio-access-key=... \
#     --from-literal=minio-secret-key=...
secret:
  name: recall-secrets
