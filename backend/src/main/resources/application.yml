server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: recall
  elasticsearch:                         # used by Spring Boot's ES health indicator
    uris: ${ES_HOST:http://localhost:9200}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:recall}
    username: ${POSTGRES_USER:recall}
    password: ${POSTGRES_PASSWORD:recall}
  jpa:
    hibernate:
      ddl-auto: update          # dev only; use Flyway/Liquibase for prod
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: recall-ingestion
      auto-offset-reset: earliest
      # A poll batch must finish inside max-poll-interval-ms or the broker evicts the
      # consumer, the group rebalances, and every record since the last commit is
      # delivered again. Ingestion embeds each document through a model, so a record
      # costs seconds, not microseconds: at the 500-record default a batch needs ~40
      # minutes against a 5-minute deadline, and the consumer reprocesses the same
      # prefix forever while making visible progress in the logs. Invisible on a
      # 24-document corpus; fatal on a 5,183-document benchmark.
      max-poll-records: ${KAFKA_MAX_POLL_RECORDS:10}
      properties:
        max.poll.interval.ms: ${KAFKA_MAX_POLL_INTERVAL_MS:600000}
    producer:
      acks: all

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    tags:
      application: recall
    distribution:
      percentiles-histogram:
        http.server.requests: true
        recall.retrieval.latency: true

recall:
  elasticsearch:
    host: ${ES_HOST:http://localhost:9200}
    index: ${ES_INDEX:recall-docs}
  embedding:
    service-url: ${EMBEDDING_SERVICE_URL:http://localhost:8000}
    dim: ${EMBEDDING_DIM:1024}
  kafka:
    ingestion-topic: ${KAFKA_INGESTION_TOPIC:recall.ingestion}
    ingestion-dlq-topic: ${KAFKA_INGESTION_DLQ_TOPIC:recall.ingestion.dlq}
    retry-max-attempts: ${KAFKA_RETRY_MAX_ATTEMPTS:3}     # retries after the first delivery
    retry-backoff-ms: ${KAFKA_RETRY_BACKOFF_MS:1000}      # initial backoff; doubles per retry
    consumer-concurrency: ${KAFKA_CONSUMER_CONCURRENCY:1}  # listener threads; capped by partitions (3)
  storage:                     # raw-doc archive + claim check (docs/adr/0005)
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:recall-raw}
    inline-max-bytes: ${INGEST_INLINE_MAX_BYTES:65536}    # larger docs travel as objectKey refs
  semantic-cache:
    threshold: ${SEMANTIC_CACHE_THRESHOLD:0.95}
    # Every lookup pulls the whole hash — embeddings included — into the app and scans it,
    # so this caps per-query latency and bandwidth, not only Redis memory. Past the cap new
    # answers are refused (recall.semantic_cache.rejected), never evicted at random.
    max-entries: ${SEMANTIC_CACHE_MAX_ENTRIES:1000}
    # Armed when an entry first creates the hash and never refreshed: a sliding window never
    # expires under steady traffic, which is when replaying an answer grounded in a corpus
    # that has since been re-ingested is worst. The whole cache rolls over at once.
    ttl-minutes: ${SEMANTIC_CACHE_TTL_MINUTES:1440}
  retrieval:
    candidates: 50            # fused candidates before rerank
    top-k: 8                  # passed to the LLM as context
    rrf-k: 60
  models:                      # see docs/adr/0002 — model tiering
    primary: ${RECALL_MODEL_DEFAULT:claude-opus-4-8}
    balanced: ${RECALL_MODEL_BALANCED:claude-sonnet-4-6}
    cheap: ${RECALL_MODEL_CHEAP:claude-haiku-4-5}
  rag:
    judge:                     # post-hoc groundedness judge (docs/adr/0004) — fail-open
      enabled: ${RAG_JUDGE_ENABLED:true}
      timeout-seconds: ${RAG_JUDGE_TIMEOUT_SECONDS:45}
    sufficiency:               # pre-generation sufficiency gate (docs/adr/0009) — fail-open
      enabled: ${RAG_SUFFICIENCY_ENABLED:true}
      confidence-threshold: ${RAG_SUFFICIENCY_CONFIDENCE_THRESHOLD:0.35}   # skip check above this rerank score
      timeout-seconds: ${RAG_SUFFICIENCY_TIMEOUT_SECONDS:45}   # CPU 3B prefill needs headroom; fail-open past this
    conformal:                 # adaptive context sizing with a coverage guarantee (docs/adr/0013)
      # Off until calibrated: `make calibrate` runs eval/calibrate.py against a real eval
      # result and prints the threshold to paste here. A threshold is only valid for the
      # alpha and temperature it was calibrated at, so the three move together.
      enabled: ${RAG_CONFORMAL_ENABLED:false}
      alpha: ${RAG_CONFORMAL_ALPHA:0.10}          # miss the relevant passage at most 10% of the time
      threshold: ${RAG_CONFORMAL_THRESHOLD:-1}    # -1 = uncalibrated; sizing stays off
      temperature: ${RAG_CONFORMAL_TEMPERATURE:1.0}
      # Hard context cap. It overrides the certificate when it binds — and when it binds
      # often enough, it *voids* it: a truncated set can miss the passage the quantile
      # included, so measured coverage falls below alpha while calibration still reports
      # success. Measured on SciFact (docs/BENCHMARK-RUNBOOK.md): at 12 the cap truncated
      # 21% of calibration sets and held-out coverage came out 80.6% [71.8, 87.5] against a
      # 90% promise; at 30 it truncated none and coverage was 85.2% [77.1, 91.3], consistent
      # with the promise. Mean context was 5.3 passages either way — the cap only changes the
      # tail. calibrate.py prints the truncation share; if it is not 0, raise this or accept
      # that the cap, not alpha, is the real promise.
      max-k: ${RAG_CONFORMAL_MAX_K:12}
      # Is the certificate above still true? (docs/adr/0016) A threshold calibrated once is
      # valid only while traffic matches the distribution it was fitted on, and that failure
      # is silent. The monitor tracks the judge's miscoverage rate with an anytime-valid
      # confidence sequence — inspected after every query, which a fixed-N binomial test
      # cannot survive (docs/adr/0012) — and warns once the promised rate is ruled out.
      monitor-enabled: ${RAG_CONFORMAL_MONITOR_ENABLED:true}
      monitor-alpha: ${RAG_CONFORMAL_MONITOR_ALPHA:0.05}   # false alarms over the whole stream, not per check
      monitor-warmup: ${RAG_CONFORMAL_MONITOR_WARMUP:50}   # judged answers before the alarm can fire
  llm:                         # provider toggle: claude (default) | groq (free)
    provider: ${LLM_PROVIDER:claude}
    # Output ceiling for every provider. A hard cut, not a hint — the answer stops
    # mid-sentence when it binds, and a truncated answer is still judged and cached like a
    # finished one. Sized for a grounded answer with citations; the CHEAP-tier one-word
    # verdicts stop long before it.
    max-tokens: ${LLM_MAX_TOKENS:4096}
    groq:
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
      model: ${GROQ_MODEL:meta-llama/llama-4-scout-17b-16e-instruct}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434/v1}
      model: ${OLLAMA_MODEL:qwen2.5-coder:3b}

logging:
  level:
    com.portfolio.recall: DEBUG
