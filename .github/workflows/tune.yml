name: tune

# Nightly self-tuning loop (docs/adr/0010): sweep retrieval knobs against the gold set on
# the real stack; if a combo beats the configured baseline beyond epsilon, open a PR that
# applies it — which the eval regression gate (docs/adr/0007) then has to prove. The loop
# proposes, the gate disposes, a human merges.
#
# Note: PRs opened with the default GITHUB_TOKEN do not trigger workflows. Add a `TUNE_PAT`
# repo secret (classic PAT, repo scope) to get checks running automatically on tuning PRs;
# without it, re-run the eval workflow on the PR via workflow_dispatch after reviewing.

on:
  schedule:
    - cron: "0 18 * * *"        # 03:00 KST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tune
  cancel-in-progress: false

jobs:
  self-tune:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TUNE_PAT || secrets.GITHUB_TOKEN }}

      - name: Restore HF model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-bge-m3-plus-reranker-v2-m3-v1

      - name: Start stack (build + health-gated)
        run: >
          HF_CACHE_DIR="$HOME/.cache/huggingface"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile full
          up -d --build --wait backend embedding-service minio

      - name: Seed corpus (indexing barrier)
        run: python3 scripts/seed_corpus.py eval/corpus.jsonl --timeout 420

      - name: Sweep tuning grid (applies the winner in-place when it beats epsilon)
        run: >
          cd eval && python3 tune.py gold.jsonl
          --report ../tune-report.md --json ../tune-result.json --apply

      - name: Publish step summary
        if: always()
        run: if [ -f tune-report.md ]; then cat tune-report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Open tuning PR if improved
        env:
          GH_TOKEN: ${{ secrets.TUNE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          improved=$(python3 -c "import json; print(json.load(open('tune-result.json'))['improved'])")
          if [ "$improved" != "True" ]; then
            echo "no improvement beyond epsilon — no PR"
            exit 0
          fi
          branch="tune/$(date -u +%Y%m%d-%H%M)"
          git config user.name "jinwovo"
          git config user.email "kownjinwoo@gmail.com"
          git checkout -b "$branch"
          git add backend/src/main/resources/application.yml
          git commit -m "tune(retrieval): apply nightly sweep winner (self-tuning loop, ADR-0010)"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Self-tuning: retrieval sweep found a better configuration" \
            --body-file tune-report.md

      - name: Dump service logs on failure
        if: failure()
        run: >
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile full
          logs --tail 200 backend embedding-service elasticsearch
