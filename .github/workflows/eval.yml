name: eval

# Retrieval-quality regression gate (docs/adr/0007): boots the real stack (ES + Nori,
# bge-m3 sidecar, Kafka ingestion), seeds the eval corpus through the async pipeline,
# and fails the build if hybrid retrieval drops below the thresholds in run_eval.py.
# Heavier than unit CI, so it only runs when retrieval-affecting paths change.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "embedding-service/**"
      - "infra/**"
      - "eval/**"
      - "scripts/seed_corpus.py"
      - "docker-compose.yml"
      - "docker-compose.ci.yml"
      - ".github/workflows/eval.yml"
      - ".github/actions/rag-eval-gate/**"
  pull_request:
    paths:
      - "backend/**"
      - "embedding-service/**"
      - "infra/**"
      - "eval/**"
      - "scripts/seed_corpus.py"
      - "docker-compose.yml"
      - "docker-compose.ci.yml"
      - ".github/workflows/eval.yml"
      - ".github/actions/rag-eval-gate/**"
  workflow_dispatch:

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retrieval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore HF model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-bge-m3-plus-reranker-v2-m3-v1

      - name: Start stack (build + health-gated)
        run: >
          HF_CACHE_DIR="$HOME/.cache/huggingface"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile full
          up -d --build --wait backend embedding-service minio

      # Dogfooding the reusable composite action — external repos use the same thing via
      #   uses: jinwovo/recall/.github/actions/rag-eval-gate@main
      - name: Seed + gated eval (rag-eval-gate action)
        uses: ./.github/actions/rag-eval-gate
        with:
          api-url: http://localhost:8080
          gold-file: eval/gold.jsonl
          corpus-file: eval/corpus.jsonl
          es-url: http://localhost:9200

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            rag-eval-results.json
            rag-eval-summary.md
          if-no-files-found: ignore

      - name: Dump service logs on failure
        if: failure()
        run: >
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile full
          logs --tail 300 backend embedding-service elasticsearch kafka
