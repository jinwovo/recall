name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # Provisions a Gradle CLI on PATH (no committed wrapper needed for CI).
      # Held at v5: upgrading to v6 accepts Gradle's Terms of Use for its proprietary
      # caching component. That is the owner's call, not a version bump (see dependabot.yml).
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.8"
      - run: gradle test --no-daemon

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"   # 20 reached end-of-life in April 2026
      - run: npm install
      - run: npm run build

  sidecar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: embedding-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Syntax check only — full lint/test added once deps are pinned for CI.
      - run: python -m compileall app

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/recall
      - run: helm template recall deploy/helm/recall > /dev/null

  # The eval harness gates every retrieval PR, so it is production code and is unit-tested
  # like production code: the statistical layer against closed forms and SciPy, the harness
  # against a stubbed search backend with hand-derivable metrics (docs/adr/0011). Standard
  # library only — no install step, same constraint the composite action runs under.
  eval-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s eval -p "test_*.py" -v

  # The rag-eval-gate action vendors the harness so external repos get a self-contained
  # action — this guard fails the build if a copy drifts from canonical.
  action-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: diff eval/run_eval.py .github/actions/rag-eval-gate/run_eval.py
      - run: diff eval/stats.py .github/actions/rag-eval-gate/stats.py
      - run: diff eval/sequential.py .github/actions/rag-eval-gate/sequential.py
      - run: diff scripts/seed_corpus.py .github/actions/rag-eval-gate/seed_corpus.py
