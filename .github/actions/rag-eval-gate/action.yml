name: "RAG eval gate"
description: >-
  Gate pull requests on retrieval quality: doc-level Recall@5/@10, MRR@10 and nDCG@10
  against your gold set — each with a 95% interval, each mode significance-tested against
  the baseline, and a statement of what your gold set can resolve at all. Four gate
  policies, including a paired regression test against a recorded run and an anytime-valid
  sequential gate that stops as soon as the verdict is settled. Optionally seeds a corpus
  first and waits for async indexing to converge.
author: jinwovo
branding:
  icon: check-circle
  color: purple

inputs:
  api-url:
    description: Base URL of the search API exposing GET /api/search?q=&mode=
    default: "http://localhost:8080"
  gold-file:
    description: "JSONL gold set: one {\"query\", \"relevant_doc_ids\"} per line"
    required: true
  corpus-file:
    description: Optional JSONL corpus to POST to /api/ingest before evaluating
    default: ""
  es-url:
    description: Elasticsearch URL used by the seeding barrier (docId terms agg)
    default: "http://localhost:9200"
  es-index:
    description: Elasticsearch index polled by the seeding barrier
    default: "recall-docs"
  seed-timeout:
    description: Seconds to wait for async indexing to converge
    default: "420"
  modes:
    description: Comma-separated retrieval modes to sweep
    default: "bm25,vector,hybrid"
  gate-mode:
    description: Mode the thresholds apply to
    default: "hybrid"
  gate-policy:
    description: >-
      point (measured >= threshold), ci-lower (95% lower bound >= threshold),
      regression (also fail on a statistically significant paired drop vs baseline-json),
      or sequential (score queries one at a time and stop the moment the verdict is
      settled — an anytime-valid confidence sequence, so a clearly-good system is cleared
      on a fraction of the gold set and a broken one fails in fewer queries still)
    default: "point"
  baseline-json:
    description: >-
      A previous run's results JSON, for gate-policy=regression. The paired test compares
      per-query scores against it, so a real regression is caught even when the mean still
      clears the threshold. Commit it, or restore it from the last green run's artifact.
    default: ""
  baseline-mode:
    description: "Mode the significance tests compare against (default: first swept mode)"
    default: ""
  bootstrap-iters:
    description: Resampling draws for intervals and Monte Carlo p-values
    default: "10000"
  sequential-seed:
    description: Seed for the query shuffle a sequential gate reads in
    default: "1337"
  min-recall5:
    default: "0.90"
  min-mrr10:
    default: "0.85"
  min-ndcg10:
    default: "0.85"

runs:
  using: composite
  steps:
    - name: Seed corpus through the pipeline (indexing barrier)
      if: ${{ inputs.corpus-file != '' }}
      shell: bash
      env:
        RECALL_API: ${{ inputs.api-url }}
        RECALL_ES: ${{ inputs.es-url }}
        RECALL_ES_INDEX: ${{ inputs.es-index }}
      run: python3 "${{ github.action_path }}/seed_corpus.py" "${{ inputs.corpus-file }}" --timeout "${{ inputs.seed-timeout }}"

    - name: Run gated retrieval eval
      shell: bash
      env:
        RECALL_API: ${{ inputs.api-url }}
      run: |
        set -euo pipefail
        args=(
          "${{ github.action_path }}/run_eval.py" "${{ inputs.gold-file }}"
          --gate --gate-mode "${{ inputs.gate-mode }}"
          --gate-policy "${{ inputs.gate-policy }}"
          --modes "${{ inputs.modes }}"
          --bootstrap-iters "${{ inputs.bootstrap-iters }}"
          --sequential-seed "${{ inputs.sequential-seed }}"
          --min-recall5 "${{ inputs.min-recall5 }}"
          --min-mrr10 "${{ inputs.min-mrr10 }}"
          --min-ndcg10 "${{ inputs.min-ndcg10 }}"
          --json rag-eval-results.json --markdown rag-eval-summary.md
        )
        # Optional inputs: an empty default must not become an empty argument. Written as
        # `if` rather than `[ -n x ] && ...` because under `set -e` a false test is a
        # non-zero status that would abort the step.
        if [ -n "${{ inputs.baseline-mode }}" ]; then
          args+=(--baseline-mode "${{ inputs.baseline-mode }}")
        fi
        if [ -n "${{ inputs.baseline-json }}" ]; then
          args+=(--baseline-json "${{ inputs.baseline-json }}")
        fi
        python3 "${args[@]}"

    - name: Publish step summary
      if: ${{ always() }}
      shell: bash
      run: if [ -f rag-eval-summary.md ]; then cat rag-eval-summary.md >> "$GITHUB_STEP_SUMMARY"; fi
